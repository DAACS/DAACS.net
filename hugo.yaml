params:
  about_us: <p>DAACS is a public benefit corporation dedicated to supporting student success in college. Developed by researchers at CUNY, University at Albany, and Rutgers University.</p>
  address: '<p class="text-uppercase"><strong><a href="mailto:sales@daacs.net" style="color:white;">sales@daacs.net</a><br/><a href="mailto:help@daacs.net" style="color:white;">help@daacs.net</a><br/><a href="mailto:admin@daacs.net" style="color:white;">admin@daacs.net</a></strong></p>'
  author: DAACS, PBC
  carouselCustomers:
    auto_play: false
    items: 6
    pagination_speed: 1000
    slide_speed: 1000
  carouselHomepage:
    auto_play: false
